# nginx reverse proxy for the EE Social vault server.
# Matches the existing sslip.io subdomain pattern on the Hermes VPS.
# Install: /etc/nginx/sites-available/ee-social  (symlink into sites-enabled)
#   sudo ln -s /etc/nginx/sites-available/ee-social /etc/nginx/sites-enabled/ee-social
#   sudo nginx -t && sudo systemctl reload nginx
# Then add TLS:  sudo certbot --nginx -d social.149.28.133.149.sslip.io

server {
    listen 80;
    server_name social.149.28.133.149.sslip.io;

    # Captures can be a few MB of cookies + storage.
    client_max_body_size 30M;

    location / {
        proxy_pass http://127.0.0.1:47321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
    }
}
