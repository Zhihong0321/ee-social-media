<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Store to Hermes Vault</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <h1>Store to Hermes Vault</h1>
        <span id="statusDot" class="dot"></span>
      </header>

      <section class="panel">
        <div class="label">Current site</div>
        <div id="activeTab" class="value">Loading...</div>
      </section>

      <section class="panel">
        <label for="username">Username / email</label>
        <input id="username" type="text" autocomplete="username" placeholder="Login username for this site">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="Login password for this site">
      </section>

      <button id="storeBtn" type="button">Store to Hermes VPS Vault</button>
      <div class="hint">Saves the session cookies <strong>and</strong> the username + password for this site to your VPS vault.</div>

      <pre id="output" aria-live="polite"></pre>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
